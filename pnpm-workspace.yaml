packages:
  - apps/*
  - packages/*
allowBuilds:
  workerd: true
  esbuild: true
  '@hugeicons/svelte': false
  vue-demi: true
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260907.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260907.1'
  - '@cloudflare/workerd-linux-64@1.20260907.1'
  - '@cloudflare/workerd-linux-arm64@1.20260907.1'
  - '@cloudflare/workerd-windows-64@1.20260907.1'
  - '@lucide/svelte@1.42.0'
  - '@types/node@26.5.0'
  - miniflare@5.20260907.0-alpha
  - workerd@1.20260907.1
  - wrangler@4.129.1
patchedDependencies:
  '@number-flow/svelte@0.4.2': patches/@number-flow__svelte@0.4.2.patch

overrides:
  # ts-morph (via shadcn CLI) pins minimatch 10.x (GHSA-g3hv-75wg-m249); patched in >=11.0.1.
  '@ts-morph/common>minimatch': ^11.0.1

# CVE-2026-111497: require patched Node runtimes.
engineStrict: true
