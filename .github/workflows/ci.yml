name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  svelte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:react
      - run: pnpm test:vue
      - run: pnpm build:vue
      - run: pnpm test:consumer:vue
      - run: pnpm build:react
      - run: pnpm test:consumer:react
      - run: pnpm lint
      - run: pnpm build
      - run: npx --no-install wrangler versions upload --dry-run
      - run: pnpm test:consumer
