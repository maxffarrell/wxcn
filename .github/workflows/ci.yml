name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

jobs:
  svelte:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:consumer

  deploy:
    needs: svelte
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-${{ github.event.pull_request.number || inputs.environment || 'production' }}
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || inputs.environment || 'production' }}
      url: ${{ steps.target.outputs.environment == 'production' && 'https://wxcn.dev' || steps.cloudflare.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the CLOUDFLARE_API_TOKEN repository secret to enable Cloudflare deployments.'
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Select deployment target
        id: target
        env:
          TARGET: ${{ github.event_name == 'pull_request' && 'preview' || inputs.environment || 'production' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "environment=$TARGET" >> "$GITHUB_OUTPUT"
          if [ "$TARGET" = production ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo '::error::Production deployments must use main.'
              exit 1
            fi
            echo 'command=deploy' >> "$GITHUB_OUTPUT"
          else
            echo "command=deploy --env preview --name wxcn-pr-${PR_NUMBER:-manual}" >> "$GITHUB_OUTPUT"
          fi
      - uses: cloudflare/wrangler-action@v4.0.0
        id: cloudflare
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ecb6cf90208469786cff01f71ef0a8cd
          workingDirectory: apps/web
          packageManager: pnpm
          command: ${{ steps.target.outputs.command }}

  cleanup-preview:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: cloudflare-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ecb6cf90208469786cff01f71ef0a8cd
          workingDirectory: apps/web
          packageManager: pnpm
          command: delete --env preview --name wxcn-pr-${{ github.event.pull_request.number }} --force
