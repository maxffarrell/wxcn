name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shared:
    name: Core and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - run: pnpm --filter @wxcn/core check
      - run: pnpm lint

  framework:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Svelte
            framework: svelte
            test: test
            build: build
            consumer_script: consumer.test-build.ts
          - name: React
            framework: react
            test: test:react
            build: build:react
            consumer_script: react-consumer.test-build.ts
          - name: Vue
            framework: vue
            test: test:vue
            build: build:vue
            consumer_script: vue-consumer.test-build.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Contract tests finish registry generation before concurrent readers start.
      - name: Test component and SSR contracts
        run: pnpm ${{ matrix.test }}
      - name: Generate consumer registry
        run: pnpm registry:build
      - name: Check types
        id: types
        background: true
        run: pnpm check:${{ matrix.framework }}
      # These scripts use isolated temporary projects; bypass the registry-writing wrapper.
      - name: Install Corepack for the Vue consumer CLI
        if: matrix.framework == 'vue'
        run: npm install --global corepack@0.36.0
      - name: Install, check, and build a clean consumer
        # shadcn-vue invokes Corepack, which Node 26 no longer bundles.
        # Install it explicitly while keeping the consumer test unchanged.
        run: node scripts/${{ matrix.consumer_script }}
      - name: Wait for type checks
        wait: types
      - name: Build production preview
        run: pnpm ${{ matrix.build }}
      - name: Validate Worker bundle
        if: matrix.framework == 'svelte'
        run: pnpm exec wrangler versions upload --dry-run
